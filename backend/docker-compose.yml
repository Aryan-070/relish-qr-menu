# Local dev stack: Postgres + Redis + the Django ASGI app + a Celery worker.
# Usage: docker compose up --build   (from backend/)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relish
      POSTGRES_PASSWORD: relish
      POSTGRES_DB: relish
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relish"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgres://relish:relish@db:5432/relish
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: dev-insecure-change-me
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://relish:relish@db:5432/relish
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      DJANGO_SECRET_KEY: dev-insecure-change-me
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

volumes:
  pgdata:
