name: backend-ci

# Lint + Django checks + pytest for the Relish restaurant-OS backend.
# Tests run on SQLite (Channels uses the InMemoryChannelLayer — no services needed).
# A Postgres-service job for RLS tests arrives in Phase 6.

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      # Migrations may not all be committed yet; build a fresh schema and run
      # the suite rather than gating on makemigrations --check.
      - name: Apply migrations
        run: |
          python manage.py makemigrations
          python manage.py migrate

      - name: Run tests
        run: pytest
